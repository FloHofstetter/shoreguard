{% extends "base.html" %}
{% block title %}{{ gateway_name }} — Shoreguard{% endblock %}

{% block breadcrumbs %}
<ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a href="/gateways">Gateways</a></li>
    <li class="breadcrumb-item active">{{ gateway_name }}</li>
</ol>
{% endblock %}

{% block content %}
<div data-island="gateway-detail" data-props='{"name": {{ gateway_name|tojson }}}'>
    <div class="text-center text-muted py-5">
        <div class="spinner-border spinner-border-sm me-2"></div>Loading...
    </div>
</div>
{% endblock %}
