{% extends "base.html" %}
{% block title %}{{ preset_name }} — Shoreguard{% endblock %}

{% block breadcrumbs %}
<ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a href="/policies">Policy Presets</a></li>
    <li class="breadcrumb-item active">{{ preset_name }}</li>
</ol>
{% endblock %}

{% block content %}
<div data-island="preset-detail" data-props='{"presetName": {{ preset_name|tojson }}}'>
    <div class="text-center text-muted py-5">
        <div class="spinner-border spinner-border-sm me-2"></div>Loading...
    </div>
</div>
{% endblock %}
